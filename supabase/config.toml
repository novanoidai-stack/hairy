# Configuracion del proyecto para el CLI de Supabase.
#
# Nace el 28 ago 2026 con un unico proposito: apagar `verify_jwt` en las cinco
# funciones a las que llama la propia base de datos (crons de pg_cron y el
# trigger de agenda). Contexto completo en
# informes/MIGRACION-CLAVES-SUPABASE-2026-08-28.md.
#
# POR QUE HAY QUE APAGARLO
# El verificador de la plataforma solo entiende JWT. Las claves nuevas
# (`sb_secret_...`) NO lo son, asi que en cuanto el vault pase a una, estas
# llamadas se rechazarian con 401 ANTES de llegar al codigo de la funcion.
#
# POR QUE NO LAS DEJA ABIERTAS
# Porque la autorizacion ya no depende de la plataforma: las cinco llaman a
# `peticionDeServicio(req)` (shared/claveServicio.ts), que compara la clave
# entrante contra la real del proyecto en tiempo constante, aceptando la nueva y
# la heredada mientras convivan, y por las dos cabeceras.
#
# La comprobacion que habia antes en tres de ellas NO servia para esto: leia la
# carga del JWT sin verificar la firma. Con `verify_jwt` encendido daba igual
# (la plataforma comprobaba la firma primero), pero apagandolo cualquiera podria
# haber fabricado un token sin firmar con `role: service_role`.
#
# OJO: esto solo se aplica si las funciones se despliegan con el CLI
# (`supabase functions deploy`). Si se despliegan desde el panel, el interruptor
# hay que tocarlo alli, funcion por funcion.

project_id = "vtrggiogjrhqtwbhbgia"

# --- Llamadas desde la propia base de datos (pg_cron / triggers) -------------

# cron "vigilar-agenda-pruebas", cada 15 min.
[functions.vigilar-agenda]
verify_jwt = false

# trigger `agenda_ojos_notify`, en CADA movimiento de agenda (modo "ojo").
[functions.agenda-optimizador]
verify_jwt = false

# cron "mecha_avisos_prueba", 3:00.
[functions.avisar-fin-prueba]
verify_jwt = false

# cron "mecha_descuento_referidos", 3:40.
[functions.sincronizar-descuento-referidos]
verify_jwt = false

# crons "mecha_informe_semanal" (lunes 6:00) y "mecha_informe_mensual" (dia 1, 6:30).
[functions.enviar-informe-periodico]
verify_jwt = false

# --- Llamadas desde fuera que no tienen JWT ---------------------------------

# La llama GitHub Actions (la CI en cada PR y el canario cada hora) para publicar
# el informe de los vigilantes. Un workflow no tiene sesion, asi que no hay JWT
# que verificar. Autoriza por su cuenta con VIGILANCIA_TOKEN, un secreto propio
# que NO es una clave de Supabase: si se filtra, lo peor que se puede hacer con
# el es ensuciar la pestaña Salud del panel. Ver el propio index.ts.
[functions.registrar-vigilancia]
verify_jwt = false

# La dispara el workflow vigilancia-bd.yml cada 6 h. Ejecuta vigilancia_bd() y
# vigilancia_bd_rendimiento() con la clave de servicio, que se queda DENTRO de
# la funcion: Actions solo manda VIGILANCIA_TOKEN (regla 4 -- Actions jamas ve
# una clave de Supabase). Misma puerta que la de arriba, ya compartida en
# shared/tokenVigilancia.ts.
[functions.ejecutar-vigilancia-bd]
verify_jwt = false

# Motor autónomo de diagnósticos IA y auto-reparación para la pestaña Salud.
# Admite dual-auth (servicio/vigilancia o staff JWT verificado internamente).
[functions.orquestador-ia]
verify_jwt = false

# --- RECONCILIADAS CONTRA PRODUCCION (8 sep 2026) ---------------------------
#
# Estas DOCE ya corrian con verify_jwt = false en produccion y NO estaban aqui.
# Este fichero solo se aplica al desplegar con el CLI, asi que mientras nadie las
# redesplegara no pasaba nada; el dia que alguien lo hiciera, el CLI les habria
# puesto la verificacion de JWT ENCIMA y habrian empezado a devolver 401 sin que
# el despliegue fallara ni avisara. Entre ellas, las dos pasarelas de pago y el
# alta de cuentas.
#
# Se descubrio al ir a desplegar stripe-webhook: la funcion llevaba en produccion
# con el interruptor apagado desde siempre, pero el repo no lo sabia.
#
# REGLA: si una funcion no tiene JWT que verificar, autoriza por su cuenta
# (regla 9 del CLAUDE.md) y su linea va AQUI en el mismo commit.

# Stripe firma sus webhooks con el signing secret del salon (o el de plataforma)
# y no manda ningun JWT de Supabase. La firma se verifica dentro, en
# constructEventAsync; con verify_jwt encendido no llegaria ni a ejecutarse.
[functions.stripe-webhook]
verify_jwt = false

# Callback de OAuth de Stripe Connect: lo abre el navegador del salon volviendo
# de Stripe, sin sesion nuestra todavia.
[functions.stripe-connect-oauth]
verify_jwt = false

# Notificacion del TPV de Redsys: la manda el banco firmada con su propia clave.
[functions.redsys-notificacion]
verify_jwt = false

# Sonda de diagnostico de la pasarela Redsys.
[functions.redsys-probe]
verify_jwt = false

# Alta publica de cuenta: por definicion todavia no hay sesion que verificar.
[functions.signup-free]
verify_jwt = false

# Restablecer contrasena: quien la pide es justo quien no puede entrar.
[functions.send-reset]
verify_jwt = false

# Envio de presupuesto al cliente final por enlace publico.
[functions.enviar-presupuesto]
verify_jwt = false

# Bandeja de mensajeria: las dispara el automatismo de n8n, que no lleva JWT
# (autoriza con la clave en la cabecera apikey; ver la caida de n8n del 29 ago).
[functions.notificar-bandeja]
verify_jwt = false

[functions.responder-mensaje-bandeja]
verify_jwt = false

# Agente de WhatsApp entrante: entra por n8n, no por una sesion de navegador.
[functions.chispa-recepcionista]
verify_jwt = false

# Asistente de la demo publica: lo usa un visitante anonimo en la landing.
[functions.chispa-dudas-demo]
verify_jwt = false

# Asistente comercial de la landing: lo usa un visitante sin cuenta.
[functions.chispa-landing]
verify_jwt = false

