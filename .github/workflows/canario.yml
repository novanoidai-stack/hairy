name: Canario

# Cada hora, el mismo smoke de pantallas pero contra PRODUCCION. Detecta lo que
# la CI no puede ver: la cache, una variable de Vercel sin actualizar, un deploy
# a medias, Supabase caido. Ver
# docs/superpowers/plans/2026-08-28-vigilantes-de-regresion.md
on:
  schedule:
    - cron: '17 * * * *'
  # Tras un merge a master, sin esperar hasta una hora a la siguiente ventana.
  # Es el momento en que mas probable es que algo se haya roto en produccion, y
  # era justo cuando mas se tardaba en enterarse.
  #
  # LIMITACION QUE HAY QUE CONOCER, porque si no este disparo miente: cuando la
  # CI termina, Vercel puede seguir desplegando. Esta corrida puede estar
  # midiendo el deploy ANTERIOR. Por eso espera un rato antes de empezar y por
  # eso NO sustituye al canario horario: lo adelanta.
  #
  # Si algun dia hace falta exactitud, la salida limpia es que la app publique su
  # commit y el smoke compruebe que coincide antes de medir; con `workflow_run`
  # a secas no se puede saber.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: canario
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  humo:
    name: Humo contra www.mechaa.es
    runs-on: ubuntu-latest
    # Si viene de la CI, solo cuando la CI paso. Medir produccion despues de una
    # CI en rojo no dice nada nuevo: ya se sabe que algo esta mal.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Ver la LIMITACION de arriba: al acabar la CI, Vercel puede seguir
      # desplegando. Este margen no lo garantiza, solo lo hace probable.
      - name: Dar tiempo al despliegue de Vercel
        if: github.event_name == 'workflow_run'
        run: sleep 120
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Este workflow corre CADA HORA: sin caché eran 24 descargas de Chromium
      # al día, ~130 MB cada una, para instalar exactamente el mismo binario.
      # La clave va por package-lock.json, que es lo que cambia cuando cambia la
      # versión de Playwright (el binario y la librería tienen que casar).
      - name: Caché del navegador de Playwright
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Con caché sigue haciendo falta instalar las librerías del SISTEMA: esas
      # viven en /usr/lib, no en ~/.cache, y no se cachean con el navegador.
      - name: Instalar navegador de Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar solo las dependencias del sistema (navegador ya cacheado)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Contra produccion NO hace falta build:web ni servidor local: la app ya
      # esta desplegada. El webServer de playwright.config.ts se desactiva con
      # PW_NO_SERVER (ver el config).
      - name: Smoke contra produccion
        id: smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://www.mechaa.es
          PW_NO_SERVER: '1'
        run: npx playwright test tests/smoke --project=publico --reporter=json > smoke.json

      # El canario SIEMPRE publica, tanto si va bien como si va mal: si dejara
      # de publicar, el panel no distinguiria "todo verde" de "el canario esta
      # muerto" (por eso staff_vigilancia_resumen marca canario_mudo a las 26 h).
      - name: Publicar el resultado
        if: always()
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/smoke-a-hallazgos.mjs smoke.json vigilancia-canario.json canario
          node scripts/vigilantes/enviar.mjs vigilancia-canario.json

      # Familia 1c: el canario tambien MIDE (carga, long tasks, fps, peticiones)
      # contra PRODUCCION. Hasta que se congele su linea base propia
      # (tests/smoke/rendimiento-baseline.canario.json, con --aprobar --origen
      # canario sobre el artefacto de abajo), mide sin comparar.
      - name: Vigilante de rendimiento (contra produccion)
        if: always() && steps.smoke.outcome != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/rendimiento.mjs rendimiento.jsonl vigilancia-rendimiento-canario.json canario
          node scripts/vigilantes/enviar.mjs vigilancia-rendimiento-canario.json

      # Familia 2a contra PRODUCCION. Aquí importa más que en la CI: los datos
      # son reales, así que un alert() o un error de permiso al pulsar significa
      # que le pasa a alguien de verdad. Hasta que se congele su línea base
      # propia (--aprobar --origen canario sobre el artefacto de abajo), mide
      # sin comparar.
      - name: Vigilante de fallos silenciosos (contra produccion)
        if: always() && steps.smoke.outcome != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/silencios.mjs silencios.jsonl vigilancia-silencios-canario.json canario
          node scripts/vigilantes/enviar.mjs vigilancia-silencios-canario.json

      - name: Guardar las medidas de rendimiento
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rendimiento-canario
          path: |
            rendimiento.jsonl
            silencios.jsonl
          retention-days: 8

      - name: Guardar el informe si algo falla
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: canario-report
          path: |
            playwright-report/
            smoke.json
          retention-days: 7

      - name: Poner el workflow en rojo si hay pantallas rotas
        if: steps.smoke.outcome == 'failure'
        run: exit 1
