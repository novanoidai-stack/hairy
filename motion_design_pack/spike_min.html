<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}#c{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }</script></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight);
// sin toneMapping, sin outputColorSpace raro
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x202020);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100); camera.position.z=5;
// UN plano rojo basico
const plane=new THREE.Mesh(new THREE.PlaneGeometry(4,3), new THREE.MeshBasicMaterial({color:0xff0000}));
scene.add(plane);
renderer.render(scene,camera);
window.__done='rendered';
</script></body></html>
