# Configuración de CodeRabbit (revisor IA de PRs, familia 12a).
# Sustituye a Copilot Code Review: este repo es privado de cuenta personal
# sin suscripción Copilot, y CodeRabbit tiene plan gratuito.
# Las instrucciones de revisión viven en .github/copilot-instructions.md
# (formato común; CodeRabbit también lo lee).

language: es-ES
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
