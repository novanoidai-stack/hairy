name: Canario

# Cada hora, el mismo smoke de pantallas pero contra PRODUCCION. Detecta lo que
# la CI no puede ver: la cache, una variable de Vercel sin actualizar, un deploy
# a medias, Supabase caido. Ver
# docs/superpowers/plans/2026-08-28-vigilantes-de-regresion.md
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: canario
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  humo:
    name: Humo contra www.mechaa.es
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El canario corre cada hora: sin caché reinstala Chromium entero 24
      # veces al día para nada. La clave lleva la versión de Playwright, así que
      # una actualización de la dependencia invalida la caché sola y no se queda
      # corriendo con un navegador viejo.
      - name: Leer la versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Caché del navegador
        id: cache-navegador
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Con caché, solo hacen falta las dependencias de sistema (apt), que no
      # viven en ~/.cache. Sin ella, la instalación completa.
      - name: Instalar navegador de Playwright
        run: |
          if [ "${{ steps.cache-navegador.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Contra produccion NO hace falta build:web ni servidor local: la app ya
      # esta desplegada. El webServer de playwright.config.ts se desactiva con
      # PW_NO_SERVER (ver el config).
      - name: Smoke contra produccion
        id: smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://www.mechaa.es
          PW_NO_SERVER: '1'
        run: npx playwright test tests/smoke --project=publico --reporter=json > smoke.json

      # El canario SIEMPRE publica, tanto si va bien como si va mal: si dejara
      # de publicar, el panel no distinguiria "todo verde" de "el canario esta
      # muerto" (por eso staff_vigilancia_resumen marca canario_mudo a las 26 h).
      - name: Publicar el resultado
        if: always()
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/smoke-a-hallazgos.mjs smoke.json vigilancia-canario.json canario
          node scripts/vigilantes/enviar.mjs vigilancia-canario.json

      # Familia 1c: el canario tambien MIDE (carga, long tasks, fps, peticiones)
      # contra PRODUCCION. Hasta que se congele su linea base propia
      # (tests/smoke/rendimiento-baseline.canario.json, con --aprobar --origen
      # canario sobre el artefacto de abajo), mide sin comparar.
      - name: Vigilante de rendimiento (contra produccion)
        if: always() && steps.smoke.outcome != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/rendimiento.mjs rendimiento.jsonl vigilancia-rendimiento-canario.json canario
          node scripts/vigilantes/enviar.mjs vigilancia-rendimiento-canario.json

      # Familia 2a contra PRODUCCIÓN. Aquí una promesa rechazada sin capturar
      # sube a bloqueante: en la CI se la come la demo, aquí se la come un salón
      # de verdad. Los avisos de error al pulsar siguen siendo aviso — pueden ser
      # una validación legítima.
      - name: Vigilante de botones que fallan en silencio (producción)
        if: always() && steps.smoke.outcome != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/silencios.mjs silencios.jsonl vigilancia-silencios-canario.json canario || true
          node scripts/vigilantes/enviar.mjs vigilancia-silencios-canario.json

      - name: Guardar las medidas de rendimiento
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rendimiento-canario
          path: rendimiento.jsonl
          retention-days: 8

      - name: Guardar el informe si algo falla
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: canario-report
          path: |
            playwright-report/
            smoke.json
          retention-days: 7

      - name: Poner el workflow en rojo si hay pantallas rotas
        if: steps.smoke.outcome == 'failure'
        run: exit 1
