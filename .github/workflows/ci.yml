name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Tests + Verificaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # Solo los errores tumban la CI. Los avisos (imports sin usar, isNaN
      # global, parseInt sin radix...) se ven en el log pero no bloquean: hay
      # ~340 heredados y convertirlos en un muro rojo el primer dia es la forma
      # segura de que alguien acabe quitando el linter.
      - name: Lint (Biome, solo errores)
        run: npx biome lint --diagnostic-level=error

      - name: Tests unitarios (Deno, lib/)
        run: npm test

      - name: Tests gateway IA (Deno)
        run: deno task test:ia

      - name: Tests de componente (Vitest)
        run: npx vitest run

      - name: Validacion de entradas de edge functions (Zod)
        run: deno task test:esquemas

      # Vigila la puerta unica a la clave de servicio. Lo que rompe si esto
      # falla: el dia que se desactive la service_role heredada, las 31 edge
      # functions se quedan sin clave a la vez.
      - name: Puerta de la clave de servicio (Deno)
        run: deno task test:claves

      - name: Verificar catálogo de modelos IA
        run: npm run verificar:modelos

      - name: Chequeo de tipos de Edge Functions críticas
        run: deno task check:edges

      # Vigilantes de invariantes. Cazan lo que no caza ningún tipo ni ningún
      # test: cosas que viven en varios sitios a la vez y se desincronizan en
      # silencio (precios en 3 sitios, referidos en 4), rutas que se abren sin
      # sesión, la caché de /app y la deuda de código muerto. Dos niveles: los
      # bloqueantes paran esto, los avisos solo salen en el log y en el panel.
      # Detalle: docs/superpowers/plans/2026-08-28-vigilantes-de-regresion.md
      - name: Tests de los propios vigilantes
        run: npm run vigilar:test

      - name: Vigilantes de invariantes
        run: node scripts/vigilantes/index.mjs --json vigilancia.json

      # Publica el informe en la pestaña Salud del panel de staff. Si los
      # secrets no están definidos no hace nada y no rompe: el veredicto ya lo
      # dio el paso anterior, esto es solo el registro.
      - name: Publicar el informe de vigilancia
        if: always()
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: node scripts/vigilantes/enviar.mjs vigilancia.json

      - name: Guardar el informe de vigilancia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigilancia
          path: vigilancia.json
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    # Las credenciales llegan como secrets del repositorio. Si NO están
    # definidas, este job sigue siendo útil: ejecuta igualmente todos los specs
    # del proyecto "publico" (landing, marketplace, portal y la agenda sobre la
    # demo compartida), que no necesitan sesión. Los autenticados se saltan.
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      # scripts/serve-web.mjs (el webServer de playwright.config.ts) sirve
      # web/, y la SPA vive en web/app, que está en .gitignore: sin este build
      # /app devuelve 404 y todos los specs del software fallan.
      - name: Compilar la app web
        run: npm run build:web

      # Ojo: estos specs leen de la Supabase REAL (tenant público de la demo).
      # Es lectura pura, pero implica que una caída de Supabase pone la CI en
      # rojo sin que nadie haya roto nada. Si eso llega a molestar, la salida es
      # sembrar un tenant de pruebas propio, no quitar el job.
      - name: E2E públicos (sin credenciales)
        run: npx playwright test --project=publico

      # El smoke de pantallas (tests/smoke/), traducido a hallazgos para la
      # pestaña Salud. Sin `continue-on-error`: si una pantalla está rota, la CI
      # tiene que ponerse roja. Lo que no puede tumbar la CI es el ENVÍO del
      # informe, y por eso ese paso lleva if: always().
      - name: Smoke de pantallas
        id: smoke
        run: npx playwright test tests/smoke --project=publico --reporter=json > smoke.json

      - name: Publicar el smoke en el panel
        if: always() && steps.smoke.conclusion != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/smoke-a-hallazgos.mjs smoke.json vigilancia-smoke.json ci
          node scripts/vigilantes/enviar.mjs vigilancia-smoke.json

      - name: E2E autenticados (solo si hay secrets)
        if: ${{ env.E2E_EMAIL != '' }}
        run: npx playwright test --project=chromium

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
