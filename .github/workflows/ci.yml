name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + Tests + Verificaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # Solo los errores tumban la CI. Los avisos (imports sin usar, isNaN
      # global, parseInt sin radix...) se ven en el log pero no bloquean: hay
      # ~340 heredados y convertirlos en un muro rojo el primer dia es la forma
      # segura de que alguien acabe quitando el linter.
      - name: Lint (Biome, solo errores)
        run: npx biome lint --diagnostic-level=error

      - name: Tests unitarios (Deno, lib/)
        run: npm test

      - name: Tests gateway IA (Deno)
        run: deno task test:ia

      - name: Tests de componente (Vitest)
        run: npx vitest run

      - name: Validacion de entradas de edge functions (Zod)
        run: deno task test:esquemas

      # Vigila la puerta unica a la clave de servicio. Las heredadas YA estan
      # desactivadas (29 ago 2026, 11:18 UTC): si esto falla, las edge functions
      # se quedan sin clave viva a la vez. El vigilante `claves` del paso de mas
      # abajo cubre lo otro -- que ninguna clave vuelva al codigo ni al bundle.
      - name: Puerta de la clave de servicio (Deno)
        run: deno task test:claves

      - name: Verificar catálogo de modelos IA
        run: npm run verificar:modelos

      - name: Chequeo de tipos de Edge Functions críticas
        run: deno task check:edges

      # El tecnificador propone cambios sobre el catálogo entero de un salón: lo
      # que importa no es que la IA acierte (eso no se prueba) sino que nada de
      # lo que devuelva pueda escribirse sin pasar por el saneador.
      - name: Tests del tecnificador de catálogo (Deno)
        run: deno task test:tecnificador

      # Vigilantes de invariantes. Cazan lo que no caza ningún tipo ni ningún
      # test: cosas que viven en varios sitios a la vez y se desincronizan en
      # silencio (precios en 3 sitios, referidos en 4), rutas que se abren sin
      # sesión, la caché de /app y la deuda de código muerto. Dos niveles: los
      # bloqueantes paran esto, los avisos solo salen en el log y en el panel.
      # Detalle: docs/superpowers/plans/2026-08-28-vigilantes-de-regresion.md
      - name: Tests de los propios vigilantes
        run: npm run vigilar:test

      - name: Vigilantes de invariantes
        run: node scripts/vigilantes/index.mjs --json vigilancia.json

      # Publica el informe en la pestaña Salud del panel de staff. Si los
      # secrets no están definidos no hace nada y no rompe: el veredicto ya lo
      # dio el paso anterior, esto es solo el registro.
      - name: Publicar el informe de vigilancia
        if: always()
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: node scripts/vigilantes/enviar.mjs vigilancia.json

      - name: Guardar el informe de vigilancia
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vigilancia
          path: vigilancia.json
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    # Las credenciales llegan como secrets del repositorio. Si NO están
    # definidas, este job sigue siendo útil: ejecuta igualmente todos los specs
    # del proyecto "publico" (landing, marketplace, portal y la agenda sobre la
    # demo compartida), que no necesitan sesión. Los autenticados se saltan.
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Misma caché que el canario (§ actions/cache): en la CI ahorra menos que
      # allí --no corre cada hora-- pero es la misma clave y el mismo binario,
      # así que el primero que pase lo deja caliente para el otro.
      - name: Caché del navegador de Playwright
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador de Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar solo las dependencias del sistema (navegador ya cacheado)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # scripts/serve-web.mjs (el webServer de playwright.config.ts) sirve
      # web/, y la SPA vive en web/app, que está en .gitignore: sin este build
      # /app devuelve 404 y todos los specs del software fallan.
      - name: Compilar la app web
        run: npm run build:web

      # Familia 1b: presupuesto de peso del bundle. Nace congelado en
      # scripts/vigilantes/peso-baseline.json; avisa (no bloquea) si sube >5%.
      # Bajar la línea base es --aprobar, un acto consciente cuyo diff se ve.
      - name: Vigilante de peso del bundle
        run: node scripts/vigilantes/peso-bundle.mjs

      # ESTE ES EL ÚNICO SITIO DE LA CI DONDE EL BUNDLE EXISTE, y por eso el
      # vigilante de claves se corre aquí ADEMÁS de en el job `check`.
      #
      # Hasta el 29 ago 2026 su comprobación más importante --la que mira si
      # Metro incrustó una clave vieja en el bundle-- no se ejecutaba nunca:
      # `check` corre los vigilantes pero no compila, y `e2e` compilaba pero no
      # los corría. La comprobación se saltaba en silencio y el paso salía verde.
      #
      # VIGILAR_BUNDLE=1 convierte "no hay bundle" en un hallazgo bloqueante en
      # vez de un silencio: si este paso se mueve antes del build, la CI lo dice.
      - name: Puerta de claves contra el bundle construido
        env:
          VIGILAR_BUNDLE: '1'
        run: node scripts/vigilantes/index.mjs --solo claves

      # Ojo: estos specs leen de la Supabase REAL (tenant público de la demo).
      # Es lectura pura, pero implica que una caída de Supabase pone la CI en
      # rojo sin que nadie haya roto nada. Si eso llega a molestar, la salida es
      # sembrar un tenant de pruebas propio, no quitar el job.
      - name: E2E públicos (sin credenciales)
        run: npx playwright test --project=publico

      # El smoke de pantallas (tests/smoke/), traducido a hallazgos para la
      # pestaña Salud. Sin `continue-on-error`: si una pantalla está rota, la CI
      # tiene que ponerse roja. Lo que no puede tumbar la CI es el ENVÍO del
      # informe, y por eso ese paso lleva if: always().
      - name: Smoke de pantallas
        id: smoke
        run: npx playwright test tests/smoke --project=publico --reporter=json > smoke.json

      - name: Publicar el smoke en el panel
        if: always() && steps.smoke.conclusion != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/smoke-a-hallazgos.mjs smoke.json vigilancia-smoke.json ci
          node scripts/vigilantes/enviar.mjs vigilancia-smoke.json

      # Familia 1a: el smoke también MIDE (carga, long tasks, fps de scroll,
      # peticiones a Supabase). Se compara contra la línea base congelada en
      # tests/smoke/rendimiento-baseline.json; solo degeneración extrema
      # (pantalla >15 s) bloquea, el resto son avisos. El trinquete solo gira
      # hacia abajo: --aprobar es el único modo de mover la base.
      - name: Vigilante de rendimiento de pantallas
        if: always() && steps.smoke.conclusion != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/rendimiento.mjs rendimiento.jsonl vigilancia-rendimiento.json ci
          node scripts/vigilantes/enviar.mjs vigilancia-rendimiento.json

      # Familia 2a: botones que fallan en SILENCIO. El smoke ya comprueba que la
      # pantalla no se rompe; estos sensores recogen lo que el botón hizo sin
      # decirlo — promesas rechazadas que no recoge nadie, alert() que la CI
      # descarta sola, y mensajes de error que aparecen tras el clic. Línea base
      # congelada en tests/smoke/silencios-baseline.json: solo avisa si SUBE.
      - name: Vigilante de fallos silenciosos
        if: always() && steps.smoke.conclusion != 'skipped'
        env:
          VIGILANCIA_URL: ${{ secrets.VIGILANCIA_URL }}
          VIGILANCIA_TOKEN: ${{ secrets.VIGILANCIA_TOKEN }}
        run: |
          node scripts/vigilantes/silencios.mjs silencios.jsonl vigilancia-silencios.json ci
          node scripts/vigilantes/enviar.mjs vigilancia-silencios.json

      - name: E2E autenticados (solo si hay secrets)
        if: ${{ env.E2E_EMAIL != '' }}
        run: npx playwright test --project=chromium

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
